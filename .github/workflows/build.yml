name: Build UI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC and raylib
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-raylib

      - name: Download Clay v0.14 header
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/nicbarker/clay/v0.14/clay.h" `
            -OutFile "clay.h"

      - name: Compile UI into a Windows executable
        shell: msys2 {0}
        run: |
          if [ -f UI.c ]; then
            SOURCE=UI.c
          elif [ -f pluto_ui.c ]; then
            SOURCE=pluto_ui.c
          else
            echo "Could not find UI.c or pluto_ui.c in the repository root."
            exit 1
          fi

          if ! grep -q "ClayCompatDeclaration" "$SOURCE"; then
            echo "The source still uses the old CLAY(id, config) syntax. Replace it with the supplied patched UI.c."
            exit 1
          fi

          gcc "$SOURCE" -o UI.exe -O2 -std=c99 -static -static-libgcc -mwindows \
            -lraylib -lopengl32 -lgdi32 -lwinmm -lm

      - name: Upload UI.exe
        uses: actions/upload-artifact@v4
        with:
          name: UI-windows-x64
          path: UI.exe
          if-no-files-found: error
