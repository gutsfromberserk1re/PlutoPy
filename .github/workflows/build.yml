name: Build UI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UCRT64 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Download Clay v0.14 header
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/nicbarker/clay/v0.14/clay.h" `
            -OutFile "clay.h"

      - name: Download raylib 6.2 source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 6.2 https://github.com/raysan5/raylib.git raylib-src

      - name: Build standalone UI.exe
        shell: msys2 {0}
        run: |
          set -euo pipefail

          if [ -f UI.c ]; then
            SOURCE=UI.c
          elif [ -f pluto_ui.c ]; then
            SOURCE=pluto_ui.c
          else
            echo "Could not find UI.c or pluto_ui.c in the repository root."
            exit 1
          fi

          if ! grep -q "ClayCompatDeclaration" "$SOURCE"; then
            echo "The source does not contain the Clay compatibility patch. Replace it with the patched UI.c."
            exit 1
          fi

          # Build raylib as a static library with its bundled GLFW backend.
          # This avoids importing glfw3.dll from the prebuilt MSYS2 raylib package.
          mkdir -p ci-build
          cat > ci-build/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(PlutoUI LANGUAGES C)

          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(USE_EXTERNAL_GLFW OFF CACHE STRING "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/../raylib-src"
              "${CMAKE_CURRENT_BINARY_DIR}/raylib"
          )

          if(NOT DEFINED UI_SOURCE_FILE)
              message(FATAL_ERROR "UI_SOURCE_FILE was not provided")
          endif()

          add_executable(UI "${CMAKE_CURRENT_LIST_DIR}/../${UI_SOURCE_FILE}")
          target_link_libraries(UI PRIVATE raylib)
          target_compile_options(UI PRIVATE -O2)
          if(MINGW)
              target_link_options(UI PRIVATE -static -static-libgcc -mwindows)
              target_link_libraries(UI PRIVATE opengl32 gdi32 winmm)
          endif()
          set_target_properties(UI PROPERTIES
              RUNTIME_OUTPUT_DIRECTORY "${CMAKE_CURRENT_BINARY_DIR}/dist"
          )
          CMAKE

          cmake -S ci-build -B ci-build/out -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUI_SOURCE_FILE="$SOURCE"

          cmake --build ci-build/out --parallel
          test -s ci-build/out/dist/UI.exe

      - name: Upload standalone UI.exe
        uses: actions/upload-artifact@v4
        with:
          name: UI-windows-x64
          path: ci-build/out/dist/UI.exe
          if-no-files-found: error
